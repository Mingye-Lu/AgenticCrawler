<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>acrawl Bridge Options</title>
  <style>
    :root {
      color-scheme: light;
    }
    html {
      width: 520px;
      min-width: 520px;
      background: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 520px;
      min-width: 520px;
      margin: 0;
      padding: 0;
      background: #ffffff;
      box-sizing: border-box;
      color: #1f2937;
    }
    .panel {
      padding: 18px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    h1 {
      color: #1f2937;
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
    }
    .subtitle {
      margin-top: 4px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }
    .connection {
      display: grid;
      grid-template-columns: 120px 1fr 1fr;
      gap: 10px;
      align-items: end;
    }
    .version:empty {
      display: none;
    }
    .version {
      flex: none;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
    }
    .form-group {
      margin: 0;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #475569;
      font-weight: 500;
      font-size: 12px;
    }
    input {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    button {
      flex: 1;
      min-height: 42px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    #save {
      background-color: #2563eb;
      color: white;
    }
    #save:hover {
      background-color: #1d4ed8;
    }
    #test {
      background-color: #f8fafc;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }
    #test:hover {
      background-color: #f1f5f9;
    }
    .toggles {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
    }
    .toggle {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 10px;
      cursor: pointer;
    }
    .toggle input {
      width: 16px;
      min-height: 0;
      margin: 2px 0 0;
      flex: none;
    }
    .toggle span {
      color: #1f2937;
      font-size: 13px;
      font-weight: 600;
    }
    .toggle small {
      display: block;
      margin-top: 2px;
      color: #64748b;
      font-size: 12px;
      font-weight: 400;
    }
    #pair {
      display: none;
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      background: #eff6ff;
    }
    #pair.waiting {
      display: block;
      border-color: #e2e8f0;
      background: #f8fafc;
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
    }
    #pair.offer {
      display: block;
    }
    #pairHost {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      color: #1e3a8a;
      overflow-wrap: anywhere;
    }
    #pairMeta {
      margin: 0 0 10px;
      font-size: 12px;
      color: #475569;
      overflow-wrap: anywhere;
    }
    #pairRow {
      display: flex;
      gap: 10px;
    }
    #pairCode {
      letter-spacing: 4px;
      font-size: 18px;
      text-align: center;
    }
    #pairButton {
      flex: none;
      width: 110px;
      background-color: #2563eb;
      color: white;
    }
    #pairNote {
      margin: 8px 0 0;
      font-size: 12px;
      color: #475569;
    }
    #pairNote.error {
      color: #c62828;
    }
    #status {
      display: block;
      margin: 0 0 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      background-color: #fff;
      border: 1px solid #cbd5e1;
      color: #475569;
    }
    #status.connected {
      background-color: #e6f7e6;
      border-color: #4caf50;
      color: #2e7d32;
    }
    #status.disconnected {
      background-color: #ffe6e6;
      border-color: #f44336;
      color: #c62828;
    }
    #status.testing {
      background-color: #fff3e0;
      border-color: #ff9800;
      color: #e65100;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div>
        <h1>acrawl Bridge</h1>
        <div class="subtitle">Save reconnects the extension. Test Connection only checks the local bridge server.</div>
      </div>
      <span id="version" class="version"></span>
    </div>

    <span id="status">Disconnected</span>

    <div id="pair">
      <p id="pairHost"></p>
      <p id="pairMeta"></p>
      <div id="pairRow">
        <input id="pairCode" type="text" inputmode="numeric" maxlength="7" placeholder="000 000" autocomplete="off">
        <button id="pairButton">Pair</button>
      </div>
      <p id="pairNote"></p>
    </div>

    <div class="connection">
      <div class="form-group">
        <label for="port">WebSocket Port</label>
        <input id="port" type="number" value="19876" min="1" max="65535">
      </div>
      <button id="save">Save</button>
      <button id="test">Test Connection</button>
    </div>

    <div class="toggles">
      <label class="toggle">
        <input id="showIndicators" type="checkbox" checked>
        <span>Show activity indicators
          <small>Glowing border on the tab acrawl is driving, plus click ripples.</small>
        </span>
      </label>
      <label class="toggle">
        <input id="highlightChanges" type="checkbox" checked>
        <span>Highlight page changes
          <small>Boxes over elements that were added (green) or changed (amber) after an action.</small>
        </span>
      </label>
    </div>

  </div>

  <script src="options.js"></script>
</body>
</html>
